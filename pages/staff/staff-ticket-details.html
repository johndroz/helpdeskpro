<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDeskPro</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <nav>
        <a href="/">HelpDeskPro</a>
        <ul>
            <li><a href="/staff">Open Tickets</a></li>
        </ul>
    </nav>
  </header>
  <main>
    <h1>Ticket Details</h1>
    <div id="error"></div>
    <div id="feedback"></div>

    <div id="ticket-details"></div>

  </main>

  <!--FOOTER-->
  <footer>
    <p>&copy; 2026 HelpDeskPro</p>
  </footer>

  <script>
    //get parameters
    const params = new URLSearchParams(window.location.search);
    const update = params.get("error");

    //Elements to display feedback or errors
    const feedbackBox = document.getElementById('feedback');
    const errorBox = document.getElementById('error');

    //Get ticket details
    const ticketId = params.get("id");
    const currentTicket = document.getElementById("ticket-details");
    async function loadTicketDetails(){
      const res = await fetch(`/staff/api/ticket?id=${ticketId}`);
      const result = await res.json();
      console.log(result);
      
      //Retrieve successfully logged in patient info
      if(result.success){
        currentTicket.innerHTML = `
            <section class="ticket-details-card left-align">
                <div>
                    <p>Created: ${result.ticket.created_at}</p>
                    <p>Ticket ID: ${result.ticket.id} - ${result.ticket.title}</p>
                    <ul>
                        <li>Status: ${result.ticket.status}</li>
                        <li>Category: ${result.ticket.category_name}</li>
                        <li>Assigned to: ${result.ticket.assigned_to || "Not Assigned"}</li>
                    </ul>
                    <p>Description: ${result.ticket.description}</p>
                </div>
            </section>
        `
      }
      else{
        feedbackBox.innerText = "Ticket not found."
      }
    }

    loadTicketDetails();

  </script>
</body>
</html>
