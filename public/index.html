<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDeskPro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
        <a href="/">HelpDeskPro</a>
    </nav>
  </header>
  <main>
    <h3>Log into HelpDeskPro below</h3>
    <div id="error"></div>
    <div id="feedback"></div>
    <form id="login-form" name="login-form" action="/login" method="POST">
        <div class="form-row">
            <label for="username">Username</label>
            <input id="username" name="username"></input>
        </div>
        <div class="form-row">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"></input> 
        </div>
        <button type="submit">Submit</button>
    </form>

  </main>

  <!--FOOTER-->
  <footer>
    <p>&copy; 2026 HelpDeskPro</p>
  </footer>

  <script>
    //get parameters
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");

    //Elements to display feedback or errors
    const feedbackBox = document.getElementById('feedback');
    const errorBox = document.getElementById('error');
    if(error == "user" || error == "invalid") errorBox.innerText = "Invalid username or password."

  </script>
</body>
</html>
